name: GradeFlow checks (no deployment)
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
  infrastructure-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.3'
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/terraform validate
      - run: terraform -chdir=infra/terraform test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r infra/ansible/requirements.txt
      - run: ansible-playbook --syntax-check -i infra/ansible/inventory.ini.example infra/ansible/site.yml
      - run: |
          for script in scripts/*.sh; do bash -n "$script"; done
