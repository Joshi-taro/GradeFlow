<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Assignment Portal | Premium Dashboard</title>
    <!-- Google Fonts: Outfit for display, Inter for body -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <!-- Animated Background Elements -->
    <div class="bg-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="logo">
            <i class="ph-fill ph-student"></i>
            <span>Portal.</span>
        </div>
        <div class="sync-status" id="sync-status">
            <div class="pulse-dot"></div>
            <span>Data synced: <strong id="last-updated" aria-live="polite">Not synced yet</strong></span>
        </div>
    </nav>

    <!-- SECTION 1: HERO -->
    <section class="hero-section">
        <h1 class="hero-title">
            Your Assignments.<br>
            <span class="gradient-text">Organized. Accessible. Automated.</span>
        </h1>
        <p class="hero-desc">
            A smarter way to track and access assignment submissions.<br>
            Automatically synced with Google Forms.
        </p>
        <button type="button" class="btn-primary" id="view-submissions-btn">
            View Submissions <i class="ph-bold ph-arrow-down"></i>
        </button>
    </section>

    <!-- MAIN DASHBOARD AREA -->
    <main class="dashboard-container" id="dashboard">
        
        <div class="dashboard-grid">
            
            <!-- SECTION 2: LIVE SUBMISSIONS DASHBOARD (Cards) -->
            <div class="submissions-section">
                <div class="section-header">
                    <h2>Live Submissions</h2>
                    <div class="filter-controls">
                        <button type="button" class="icon-btn" id="refresh-data" title="Refresh API Data" aria-label="Refresh API Data">
                            <i class="ph ph-arrows-clockwise"></i>
                        </button>
                    </div>
                </div>
                
                <div class="submissions-grid" id="submissions-grid">
                    <!-- Cards will be generated by JS -->
                </div>
            </div>

            <!-- SECTION 3: ACTIVITY FEED -->
            <div class="activity-section">
                <div class="section-header">
                    <h2>Activity Feed</h2>
                </div>
                <div class="glass-panel">
                    <ul class="activity-list" id="activity-list">
                        <!-- Activity items generated by JS -->
                    </ul>
                </div>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>&copy; 2026 GradeFlow Team</p>
            <p class="footer-subtitle">Powered by Google Apps Script &amp; automated CI/CD</p>
        </div>
    </footer>

    <!-- GSAP & JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
    <script src="config.js"></script>
    <script src="core.js"></script>
    <script src="script.js"></script>
</body>
</html>
