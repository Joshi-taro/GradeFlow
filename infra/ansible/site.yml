---
- name: Configure a single Ubuntu K3s server (no Jenkins listener)
  hosts: gradeflow
  become: true
  gather_facts: true
  vars:
    k3s_version: v1.36.3+k3s1
    # Override for an explicitly reviewed upgrade, never use an unpinned channel.
    k3s_arch: "{{ {'aarch64': 'arm64', 'x86_64': 'amd64'}[ansible_facts.architecture] }}"
    k3s_asset: "{{ 'k3s-arm64' if k3s_arch == 'arm64' else 'k3s' }}"
    k3s_release: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}"
  tasks:
    - name: Check supported OS and architecture
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_major_version | int >= 24
          - ansible_facts.architecture in ['aarch64', 'x86_64']
          - ansible_facts.swaptotal_mb == 0
        fail_msg: Use Ubuntu 24.04+, arm64/amd64 and a host with swap disabled before configuring K3s.
    - name: Install host prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, openssh-server, iptables, conntrack, socat]
        state: present
        update_cache: true
        cache_valid_time: 3600
    - name: Configure kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/gradeflow.conf
        content: "overlay\nbr_netfilter\n"
        mode: '0644'
    - name: Load required modules
      ansible.builtin.command: "modprobe {{ item }}"
      changed_when: false
      loop: [overlay, br_netfilter]
    - name: Enable forwarding and bridge filtering
      ansible.builtin.copy:
        dest: /etc/sysctl.d/90-gradeflow.conf
        content: |
          net.ipv4.ip_forward=1
          net.bridge.bridge-nf-call-iptables=1
        mode: '0644'
      notify: Reload sysctl
    - name: Apply networking before starting K3s
      ansible.builtin.meta: flush_handlers
    - name: Harden SSH with a drop-in loaded before cloud-init defaults
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-gradeflow.conf
        mode: '0600'
        validate: /usr/sbin/sshd -t -f %s
        content: |
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          PermitRootLogin no
          PubkeyAuthentication yes
          MaxAuthTries 3
          X11Forwarding no
      notify: Reload SSH
    - name: Create private K3s config directory
      ansible.builtin.file:
        path: /etc/rancher/k3s
        state: directory
        mode: '0700'
    - name: Configure K3s with no public ingress controller or load balancer
      ansible.builtin.copy:
        dest: /etc/rancher/k3s/config.yaml
        mode: '0600'
        content: |
          write-kubeconfig-mode: "0600"
          secrets-encryption: true
          disable:
            - traefik
            - servicelb
          node-name: gradeflow-k3s
      notify: Restart K3s
    - name: Download versioned binary and verify published SHA256
      ansible.builtin.get_url:
        url: "{{ k3s_release }}/{{ k3s_asset }}"
        dest: /usr/local/bin/k3s
        mode: '0755'
        checksum: "sha256:{{ k3s_release }}/sha256sum-{{ k3s_arch }}.txt"
      notify: Restart K3s
    - name: Install systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s.service
        mode: '0644'
        content: |
          [Unit]
          Description=GradeFlow K3s
          Wants=network-online.target
          After=network-online.target
          [Service]
          Type=notify
          ExecStart=/usr/local/bin/k3s server
          KillMode=process
          Delegate=yes
          LimitNOFILE=1048576
          LimitNPROC=infinity
          TasksMax=infinity
          Restart=always
          RestartSec=5
          [Install]
          WantedBy=multi-user.target
      notify: Restart K3s
    - name: Start K3s
      ansible.builtin.systemd_service:
        name: k3s
        enabled: true
        state: started
        daemon_reload: true
    - name: Apply service changes before checking readiness
      ansible.builtin.meta: flush_handlers
    - name: Wait for node readiness
      ansible.builtin.command: /usr/local/bin/k3s kubectl wait --for=condition=Ready node/gradeflow-k3s --timeout=180s
      changed_when: false
      when: not ansible_check_mode
  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true
    - name: Reload SSH
      ansible.builtin.systemd_service:
        name: ssh
        state: reloaded
    - name: Restart K3s
      ansible.builtin.systemd_service:
        name: k3s
        state: restarted
        daemon_reload: true
